name: Build macOS app

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
  # Actions → Build macOS app → Run workflow → type a version (e.g. 1.0.1)
  # to build both DMGs and publish a GitHub Release that installed copies
  # update to automatically. Leave the version empty for a test build.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.1 (empty = test build, no release)'
        required: false
        default: ''
      notes:
        description: "What's new (shown in the update prompt)"
        required: false
        default: ''

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - name: Engine, loudness and updater tests
        run: npm test
      - name: Electron end-to-end test (null audio device)
        run: |
          npm i --no-save playwright
          xvfb-run -a -s "-screen 0 1700x1100x24" node test/electron-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: test/output/*.png
          if-no-files-found: ignore

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon
            arch: arm64
          - os: macos-15-intel  # Intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (compiles the Core Audio engine)
        run: npm ci
      - name: Engine tests on this Mac
        run: node test/engine-test.cjs
      - name: Audio devices on this runner (informational)
        run: node -e "console.log(JSON.stringify(require('./build/Release/uavdaw.node').listDevices(), null, 1))" || true
      - name: Use the release version as the app version
        if: env.RELEASE_VERSION != ''
        run: npm version --no-git-tag-version --allow-same-version "${RELEASE_VERSION#v}"
      - name: Build .dmg + .zip
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Sign + notarise only when the certificate secrets exist; otherwise
          # build unsigned (scripts/adhoc-sign.cjs ad-hoc signs the app).
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Verify code signature and bundled engine
        run: |
          APP=$(ls -d dist/mac*/*.app | head -1)
          codesign --verify --deep "$APP" && echo "signature OK"
          file "$APP/Contents/Resources/app.asar.unpacked/build/Release/uavdaw.node"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Unique-AV-DAW-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  # Publish a GitHub Release with update-mac.json – installed apps pick it up
  # automatically. Triggered by Run workflow (with a version) or a v* tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Unique-AV-DAW-mac-*
          path: dist
          merge-multiple: true
      - name: Release notes and tag
        id: meta
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          V="${RELEASE_VERSION#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES" > notes.txt; else git log -1 --pretty=%B > notes.txt; fi
      - run: node scripts/make-update-manifest.mjs dist "${{ steps.meta.outputs.version }}" notes.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Unique AV DAW ${{ steps.meta.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/update-mac.json
          body_path: notes.txt
